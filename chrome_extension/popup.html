<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>PC Control — YouTube Music</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e6; --ok: #1a8f3c; --bad: #c62828; --warn: #b26a00; --accent: #ff0033; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1e20; --fg: #f2f2f4; --muted: #a0a0a6; --line: #34343a; --ok: #4cc370; --bad: #ff6b6b; --warn: #f0a33a; } }
    body { margin: 0; width: 300px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
    header img { width: 20px; height: 20px; }
    main { padding: 12px 14px; display: grid; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .ok .dot { background: var(--ok); } .bad .dot { background: var(--bad); } .warn .dot { background: var(--warn); }
    .muted { color: var(--muted); font-size: 12px; }
    .track { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 34px; }
    .track b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    label { font-size: 12px; color: var(--muted); }
    input { width: 80px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
    button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    footer { padding: 8px 14px 12px; }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""> PC Control — YouTube Music</header>
  <main>
    <div class="row" id="conn"><span class="dot"></span><span id="connText">Проверка…</span></div>
    <div class="track" id="track"><span class="muted">Нет данных</span></div>
    <div class="row">
      <label for="port">Порт моста</label>
      <input id="port" type="number" min="1024" max="65535">
      <button id="save">Сохранить</button>
    </div>
    <div class="muted">По умолчанию 5017 (config.json → media_bridge_port). Подключение только к этому ПК (127.0.0.1).</div>
  </main>
  <footer class="row">
    <button class="primary" id="open">Открыть YouTube Music</button>
    <button id="retry">Переподключить</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
