name: Sync Binaries

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/Launcher.cs'
      - 'scripts/Uninstall.cs'
      - 'scripts/Installer.cs'
      - 'version.json'
      - 'pc_control.ico'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-binaries
  cancel-in-progress: true

jobs:
  sync:
    name: Compile & Prepare Binaries Sync
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Launcher.exe, unstaller.exe and Uninstall.exe
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          & $csc /nologo /optimize+ /target:winexe /win32icon:pc_control.ico /out:Launcher.exe scripts\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "Launcher.exe compilation failed" }

          & $csc /nologo /optimize+ /target:winexe /win32icon:pc_control.ico /out:unstaller.exe /r:System.IO.Compression.FileSystem.dll /r:System.IO.Compression.dll scripts\Uninstall.cs
          if ($LASTEXITCODE -ne 0) { throw "unstaller.exe compilation failed" }

          Copy-Item unstaller.exe Uninstall.exe -Force

      - name: Run Binary Sync Verification Tests
        env:
          PC_CONTROL_TEST_MODE: "1"
          SAFE_TEST_MODE: "1"
          PYTHONPATH: "."
        run: |
          python scripts/verify_release_consistency.py
          python -m unittest tests.test_binary_sync tests.test_installer tests.test_uninstall_foreign_files -v

      - name: Create Pull Request with Updated Binaries
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Automated] Sync Launcher.exe and unstaller.exe binaries [skip ci]"
          branch: "automated/sync-binaries"
          title: "[Automated] Sync Launcher.exe and unstaller.exe with latest sources"
          body: |
            ### Automated Binary Synchronization
            Triggered by commit `${{ github.sha }}` on branch `main`.
            
            **Compiled Artifacts:**
            - `Launcher.exe`
            - `unstaller.exe`
            - `Uninstall.exe`
            
            All regression tests and release consistency checks passed successfully.
          labels: |
            automated-sync
            binaries
          delete-branch: true
