name: Release Build & Distribution

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.4.0)'
        required: true
        default: 'v2.4.0'

permissions:
  contents: write

concurrency:
  group: pc-control-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Binaries & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build C# Desktop Launcher (Launcher.exe)
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          & $csc /nologo /optimize+ /target:winexe /win32icon:pc_control.ico /out:Launcher.exe scripts\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }
          Write-Host "Launcher.exe built: $((Get-Item Launcher.exe).Length) bytes"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Rust Streamer (streamer.exe)
        run: |
          cargo build --release --manifest-path streamer_rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Streamer build failed" }
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          if (Test-Path streamer_rs/target/release/streamer.exe) {
            Copy-Item streamer_rs/target/release/streamer.exe tools/streamer.exe -Force
          } elseif (Test-Path streamer_rs/target/release/streamer_rs.exe) {
            Copy-Item streamer_rs/target/release/streamer_rs.exe tools/streamer.exe -Force
          } else {
            throw "Compiled streamer binary not found"
          }
          Write-Host "streamer.exe built: $((Get-Item tools/streamer.exe).Length) bytes"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Client (PC_Control.apk)
        run: |
          python scripts/build_apk.py
          if ($LASTEXITCODE -ne 0) { throw "APK build failed" }
          Write-Host "PC_Control.apk built: $((Get-Item PC_Control.apk).Length) bytes"

      - name: Build complete Windows package
        run: |
          python -m unittest tests.test_update_system tests.test_distribution_audit tests.test_launcher_audit tests.test_network_setup -q
          if ($LASTEXITCODE -ne 0) { throw "Release regression tests failed" }
          python scripts/build_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "Portable runtime build failed" }
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
          Copy-Item dist/PC_Control_Windows.zip PC_Control_Windows.zip
          Copy-Item dist/release-manifest.json release-manifest.json

      - name: Generate release checksums
        run: |
          $files = @("Launcher.exe", "tools/streamer.exe", "PC_Control.apk", "PC_Control_Windows.zip", "release-manifest.json")
          $lines = foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
              "$hash  $f"
            }
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            Launcher.exe
            tools/streamer.exe
            PC_Control.apk
            SHA256SUMS.txt
            PC_Control_Windows.zip
            release-manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
