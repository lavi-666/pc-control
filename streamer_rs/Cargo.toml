[package]
name = "streamer_rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "streamer"
path = "src/main.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading"
] }
scrap = "0.5.0"
